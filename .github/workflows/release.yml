name: Release

# Genera un tag semver (patch auto-incrementado), compila binarios para
# Linux/macOS/Windows y publica un GitHub Release con changelog, cada vez que
# se mergea develop → main (push a la rama main).
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calcular próxima versión (patch)
        id: next
        run: |
          last=$(git tag --sort=-v:refname | head -1 || true)
          if [ -z "$last" ]; then
            # Sin tags aún: arranca en v0.1.0 (coincide con version = "0.1.0"
            # del workspace Cargo.toml).
            version="0.1.0"
          else
            v="${last#v}"
            major="${v%%.*}"
            rest="${v#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            version="$major.$minor.$((patch + 1))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Último tag: ${last:-ninguno} → v$version"

      - name: Crear y pushear el tag
        run: |
          if git rev-parse "v${{ steps.next.outputs.version }}" >/dev/null 2>&1; then
            echo "El tag ya existe; lo reutilizamos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.next.outputs.version }}" -m "Release v${{ steps.next.outputs.version }}"
          git push origin "v${{ steps.next.outputs.version }}"

      - name: Generar changelog (PRs mergeados desde el tag anterior)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(git tag --sort=-v:refname | sed -n 2p || true)
          if [ -z "$prev" ]; then
            {
              echo "### Release inicial"
              echo ""
              echo "- Release v${{ steps.next.outputs.version }} con las primeras features de probe."
            } > changelog.txt
          else
            prs=$(git log "$prev..HEAD" --merges --format=%s \
              | grep -oE 'Merge pull request #[0-9]+' \
              | grep -oE '[0-9]+' | sort -u)
            {
              echo "### PRs mergeados en esta release"
              echo ""
              for num in $prs; do
                title=$(gh pr view "$num" --json title --jq '.title' 2>/dev/null || echo "sin título")
                echo "- #$num — $title"
              done
            } > changelog.txt
          fi
      - name: Subir changelog como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: changelog.txt
          if-no-files-found: error
          overwrite: true

  build:
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Instalar target de Rust
        run: rustup target add ${{ matrix.target }}
      - name: Dependencias de build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Build release (probe-cli + probe-server)
        run: cargo build --release --target ${{ matrix.target }} -p probe-cli -p probe-server
      - name: Renombrar binarios con sufijo de plataforma
        shell: bash
        run: |
          exe=""
          [ "${{ matrix.os }}" = "windows-latest" ] && exe=".exe"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/probe$exe" "dist/probe-${{ matrix.suffix }}$exe"
          cp "target/${{ matrix.target }}/release/probe-server$exe" "dist/probe-server-${{ matrix.suffix }}$exe"
          ls -la dist
      - name: Subir binarios como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.suffix }}
          path: dist
          if-no-files-found: error
          overwrite: true

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar binarios
        uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: artifacts
          merge-multiple: true
      - name: Descargar changelog
        uses: actions/download-artifact@v8
        with:
          name: changelog
          path: changelog
      - name: Listar assets
        run: ls -la artifacts && echo "--- changelog:" && ls -la changelog
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          body_path: changelog/changelog.txt
          files: artifacts/*
          fail_on_unmatched_files: false
