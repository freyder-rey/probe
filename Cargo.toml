[workspace]
resolver = "2"
members = ["crates/probe-core", "crates/probe-cli", "crates/probe-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
probe-core = { path = "crates/probe-core" }
reqwest = { version = "0.12", features = ["json", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
csv = "1"
async-trait = "0.1"
tower-http = { version = "0.6", features = ["fs"] }
